<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Admin | Footscray Dental Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2d4459;--navy-deep:#101b26;--gold:#bd995e;--gold-text:#7d6130;--gold-pale:#ecdfc6;--text:#33424f;--soft:#66727e;--faint:#8a949d;--line:#dde3e8;--wash:#f5f7f9;--white:#fff;--red:#a4402f;--red-wash:#fbf2f0;--green:#2f6b4f;--green-wash:#eef4ec}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--wash);color:var(--text);font:15px/1.5 Poppins,system-ui,sans-serif}
  a{color:var(--gold-text)}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---- login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--white);border-radius:20px;box-shadow:0 10px 40px rgba(16,27,38,.08);padding:36px 32px;width:100%;max-width:400px}
  .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);font-weight:600;margin-bottom:6px}
  h1{font-size:22px;margin:0 0 20px;color:var(--navy)}
  label{display:block;font-size:13px;font-weight:500;color:var(--navy);margin:14px 0 6px}
  .in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:border-color .15s}
  .in:focus{border-color:var(--navy)}
  textarea.in{min-height:96px;resize:vertical;line-height:1.55}
  textarea.in.tall{min-height:180px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:10px 20px;font-weight:500;transition:all .15s}
  .btn:hover{background:var(--navy-deep);border-color:var(--navy-deep)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn--ghost{background:transparent;color:var(--navy)}
  .btn--ghost:hover{background:var(--wash)}
  .btn--gold{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
  .btn--gold:hover{background:#a9884f;border-color:#a9884f}
  .btn--sm{padding:6px 12px;font-size:13px}
  .btn--danger{border-color:#e6c3bb;color:var(--red);background:#fff}
  .btn--danger:hover{background:var(--red-wash)}
  .msg{border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px}
  .msg--err{background:var(--red-wash);color:var(--red);border:1px solid #e6c3bb}
  .msg--ok{background:var(--green-wash);color:var(--green);border:1px solid #c4d8bd}
  .msg--warn{background:#fdfaf4;color:var(--gold-text);border:1px solid var(--gold-pale)}

  /* ---- app */
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .side{background:var(--navy-deep);color:#e8ecef;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .brand{color:var(--gold)}
  .side h2{font-size:17px;margin:0 0 18px;color:#fff}
  .nav a{display:block;color:#a7b4bf;text-decoration:none;padding:9px 12px;border-radius:10px;font-size:14px;margin-bottom:2px}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
  .side-foot{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#a7b4bf}
  .side-foot a,.side-foot button{color:#e8ecef;background:none;border:0;padding:6px 0;display:block;text-align:left;font-size:13px}
  .side-foot a:hover,.side-foot button:hover{color:var(--gold)}
  .main{padding:32px 40px 120px;max-width:920px}
  .main h2{font-size:24px;margin:0 0 6px;color:var(--navy)}
  .intro{color:var(--soft);margin:0 0 22px;font-size:14px}
  .help{font-size:12.5px;color:var(--faint);margin-top:5px}
  .field{margin-bottom:6px}
  .req{color:var(--red)}
  .banner{border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:14px}
  .banner strong{display:block;margin-bottom:2px}

  /* ---- lists */
  .list{margin-top:8px}
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;margin-bottom:12px}
  .item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .item-title{font-weight:500;color:var(--navy);font-size:14px}
  .item-tools{display:flex;gap:6px}
  .item-tools button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;color:var(--soft);display:grid;place-items:center}
  .item-tools button:hover{border-color:var(--navy);color:var(--navy)}
  .item-tools button.del:hover{border-color:var(--red);color:var(--red)}
  .item label{margin-top:10px}

  /* ---- images */
  .img-field{display:flex;gap:14px;align-items:flex-start}
  .img-prev{width:120px;height:90px;border-radius:10px;background:var(--wash) center/cover no-repeat;border:1px solid var(--line);flex:none}
  .img-ctl{flex:1}
  .img-ctl .in{margin-bottom:8px}

  /* ---- checkbox */
  .check{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
  .check input{width:18px;height:18px;accent-color:var(--navy)}
  .check label{margin:0}

  /* ---- save bar */
  .savebar{position:fixed;left:260px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 40px;display:flex;align-items:center;gap:16px;z-index:5}
  .savebar .status{flex:1;font-size:14px;color:var(--soft)}
  .savebar .status.dirty{color:var(--gold-text)}
  .savebar .status.ok{color:var(--green)}
  .savebar .status.err{color:var(--red)}
  .errlist{margin:6px 0 0;padding-left:18px;font-size:13px}

  /* ---- modal */
  .modal{position:fixed;inset:0;background:rgba(16,27,38,.5);display:grid;place-items:center;z-index:20;padding:20px}
  .modal-card{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:420px}
  .modal-card h3{margin:0 0 6px;color:var(--navy)}
  .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .pages-pick{margin-bottom:18px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto}
    .nav{display:flex;flex-wrap:wrap;gap:4px}
    .main{padding:22px 18px 140px}
    .savebar{left:0;padding:12px 18px;flex-wrap:wrap}
  }
</style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<div id="login" class="login">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="brand">Footscray Dental Studio</div>
    <h1>Site admin</h1>
    <label for="u">Username</label>
    <input class="in" id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input class="in" id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="login-msg"></div>
    <div style="margin-top:22px"><button class="btn" id="login-btn" type="submit">Sign in</button></div>
  </form>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">Footscray Dental Studio</div>
    <h2>Site admin</h2>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="who" style="margin-bottom:8px"></div>
      <a href="/" target="_blank" rel="noopener">View the website ↗</a>
      <button type="button" id="pw-open">Change password</button>
      <button type="button" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="notice"></div>
    <div id="section"></div>
  </main>

  <div class="savebar">
    <div class="status" id="status">No unsaved changes.</div>
    <button class="btn btn--ghost" type="button" id="discard" disabled>Discard</button>
    <button class="btn btn--gold" type="button" id="save" disabled>Save &amp; publish</button>
  </div>
</div>

<!-- ============================ PASSWORD MODAL ============================ -->
<div id="pw-modal" class="modal hidden">
  <form class="modal-card" id="pw-form">
    <h3>Change password</h3>
    <p class="help">At least 12 characters, with upper and lower case letters and a number.</p>
    <label for="pw-cur">Current password</label>
    <input class="in" id="pw-cur" type="password" autocomplete="current-password" required>
    <label for="pw-new">New password</label>
    <input class="in" id="pw-new" type="password" autocomplete="new-password" required>
    <label for="pw-new2">New password again</label>
    <input class="in" id="pw-new2" type="password" autocomplete="new-password" required>
    <div id="pw-msg"></div>
    <div class="row">
      <button class="btn btn--ghost" type="button" id="pw-cancel">Cancel</button>
      <button class="btn" type="submit" id="pw-save">Change password</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';
  var API = '/api/admin/';
  var state = { content: null, saved: null, schema: null, section: null, page: null, user: null };

  // ---------------------------------------------------------------- helpers
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function get(o, path) { return String(path).split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o); }
  function set(o, path, v) {
    var parts = String(path).split('.'), cur = o;
    for (var i = 0; i < parts.length - 1; i++) { if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {}; cur = cur[parts[i]]; }
    cur[parts[parts.length - 1]] = v;
  }
  function api(action, method, body) {
    return fetch(API + action, {
      method: method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Requested-With': 'fetch' },
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'Server returned an unexpected response.' }; })
        .then(function (j) { if (r.status === 401 && action !== 'login') showLogin(); j.status = r.status; return j; });
    }).catch(function () { return { ok: false, error: 'Could not reach the server. Check your connection.' }; });
  }
  function msg(node, kind, text, extra) {
    node.innerHTML = '';
    if (!text) return;
    var box = el('div', { class: 'msg msg--' + kind, text: text });
    if (extra && extra.length) box.appendChild(el('ul', { class: 'errlist' }, extra.map(function (t) { return el('li', { text: t }); })));
    node.appendChild(box);
  }
  function isDirty() { return JSON.stringify(state.content) !== JSON.stringify(state.saved); }
  function setStatus(kind, text) {
    var s = $('status'); s.className = 'status ' + (kind || ''); s.textContent = text;
    var d = isDirty(); $('save').disabled = !d; $('discard').disabled = !d;
  }
  function markDirty() { setStatus('dirty', 'You have unsaved changes.'); }
  window.addEventListener('beforeunload', function (e) { if (state.content && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  // ---------------------------------------------------------------- login
  function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('p').value = ''; }
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('login-btn').disabled = true; msg($('login-msg'));
    api('login', 'POST', { username: $('u').value.trim(), password: $('p').value }).then(function (j) {
      $('login-btn').disabled = false;
      if (!j.ok) { msg($('login-msg'), 'err', j.error || 'Sign in failed.'); return; }
      boot();
    });
  });
  $('logout').addEventListener('click', function () {
    if (isDirty() && !confirm('You have unsaved changes. Sign out anyway?')) return;
    api('logout', 'POST').then(function () { state.content = null; showLogin(); });
  });

  // ---------------------------------------------------------------- boot
  function boot() {
    api('me').then(function (me) {
      if (!me.ok) { showLogin(); return; }
      state.user = me.user;
      $('who').textContent = 'Signed in as ' + me.user;
      var notes = [];
      if (me.mustChangePassword) notes.push(['warn', 'You are using the initial password. Please change it now using the link in the sidebar.']);
      if (me.missing && me.missing.length) notes.push(['warn', 'Server setup is incomplete: ' + me.missing.join('; ')]);
      $('notice').innerHTML = '';
      notes.forEach(function (n) { $('notice').appendChild(el('div', { class: 'banner msg--' + n[0], text: n[1] })); });
      return api('content').then(function (j) {
        if (!j.ok) { msg($('notice'), 'err', j.error); return; }
        state.schema = j.schema; state.content = j.content; state.saved = JSON.parse(JSON.stringify(j.content));
        state.section = state.section || j.schema.sections[0].id;
        showApp(); renderNav(); renderSection(); setStatus('', 'No unsaved changes.');
      });
    });
  }

  // ---------------------------------------------------------------- navigation
  function renderNav() {
    var nav = $('nav'); nav.innerHTML = '';
    state.schema.sections.forEach(function (s) {
      nav.appendChild(el('a', { href: '#' + s.id, class: s.id === state.section ? 'on' : '', text: s.title,
        onclick: function (e) { e.preventDefault(); state.section = s.id; renderNav(); renderSection(); window.scrollTo(0, 0); } }));
    });
  }

  // ---------------------------------------------------------------- fields
  function inputFor(field, path, value) {
    var wrap = el('div', { class: 'field' });
    var id = 'f-' + path.replace(/[^a-z0-9]/gi, '-');
    if (field.type === 'checkbox') {
      var cb = el('input', { type: 'checkbox', id: id });
      cb.checked = !!value;
      cb.addEventListener('change', function () { set(state.content, path, cb.checked); markDirty(); });
      wrap.appendChild(el('div', { class: 'check' }, [cb, el('label', { for: id, text: field.label })]));
      if (field.help) wrap.appendChild(el('div', { class: 'help', text: field.help }));
      return wrap;
    }
    wrap.appendChild(el('label', { for: id, html: escapeHtml(field.label) + (field.required ? ' <span class="req">*</span>' : '') }));
    if (field.type === 'image') {
      var prev = el('div', { class: 'img-prev' });
      var pathIn = el('input', { class: 'in', id: id, placeholder: '/assets/img/...' });
      pathIn.value = value || '';
      var setPrev = function (v) { prev.style.backgroundImage = v ? 'url("' + v.replace(/"/g, '') + '")' : 'none'; };
      setPrev(value);
      pathIn.addEventListener('input', function () { set(state.content, path, pathIn.value.trim()); setPrev(pathIn.value.trim()); markDirty(); });
      var file = el('input', { type: 'file', accept: 'image/*', class: 'hidden' });
      var up = el('button', { class: 'btn btn--ghost btn--sm', type: 'button', text: 'Upload new image' });
      var note = el('div', { class: 'help', text: field.help || 'JPG, PNG or WebP, under 4 MB.' });
      up.addEventListener('click', function () { file.click(); });
      file.addEventListener('change', function () {
        var f = file.files[0]; if (!f) return;
        if (f.size > 4 * 1024 * 1024) { note.textContent = 'That image is over 4 MB. Please resize it first.'; return; }
        up.disabled = true; up.textContent = 'Uploading…';
        var rd = new FileReader();
        rd.onload = function () {
          api('upload', 'POST', { name: f.name, type: f.type, data: rd.result }).then(function (j) {
            up.disabled = false; up.textContent = 'Upload new image';
            if (!j.ok) { note.textContent = j.error || 'Upload failed.'; return; }
            pathIn.value = j.path; set(state.content, path, j.path); setPrev(j.path); markDirty();
            note.textContent = 'Uploaded. Save to publish it.';
          });
        };
        rd.readAsDataURL(f);
      });
      wrap.appendChild(el('div', { class: 'img-field' }, [prev, el('div', { class: 'img-ctl' }, [pathIn, up, file, note])]));
      return wrap;
    }
    var input;
    if (field.type === 'paragraphs' || field.type === 'lines') {
      input = el('textarea', { class: 'in' + (field.type === 'paragraphs' ? ' tall' : ''), id: id });
    } else {
      input = el('input', { class: 'in', id: id, type: 'text' });
    }
    if (field.placeholder) input.placeholder = field.placeholder;
    input.value = value == null ? '' : value;
    input.addEventListener('input', function () { set(state.content, path, input.value); markDirty(); });
    wrap.appendChild(input);
    var help = field.help || (field.type === 'paragraphs' ? 'Leave a blank line between paragraphs. **bold** for bold.' : field.type === 'lines' ? 'One per line.' : '');
    if (help) wrap.appendChild(el('div', { class: 'help', text: help }));
    return wrap;
  }

  function listFor(field, path) {
    var box = el('div');
    box.appendChild(el('label', { text: field.label }));
    if (field.help) box.appendChild(el('div', { class: 'help', text: field.help }));
    var list = el('div', { class: 'list' });
    box.appendChild(list);
    function draw() {
      list.innerHTML = '';
      var items = get(state.content, path);
      if (!Array.isArray(items)) { items = []; set(state.content, path, items); }
      items.forEach(function (item, i) {
        var card = el('div', { class: 'item' });
        var title = (field.fields[0] && item[field.fields[0].key]) || (field.item_label + ' ' + (i + 1));
        var tools = el('div', { class: 'item-tools' }, [
          el('button', { type: 'button', title: 'Move up', html: '&uarr;', onclick: function () { if (i > 0) { items.splice(i - 1, 0, items.splice(i, 1)[0]); markDirty(); draw(); } } }),
          el('button', { type: 'button', title: 'Move down', html: '&darr;', onclick: function () { if (i < items.length - 1) { items.splice(i + 1, 0, items.splice(i, 1)[0]); markDirty(); draw(); } } }),
          el('button', { type: 'button', class: 'del', title: 'Remove', html: '&times;', onclick: function () { if (confirm('Remove this ' + field.item_label.toLowerCase() + '?')) { items.splice(i, 1); markDirty(); draw(); } } })
        ]);
        card.appendChild(el('div', { class: 'item-head' }, [el('div', { class: 'item-title', text: String(title).slice(0, 70) }), tools]));
        field.fields.forEach(function (sub) { card.appendChild(inputFor(sub, path + '.' + i + '.' + sub.key, item[sub.key])); });
        list.appendChild(card);
      });
      list.appendChild(el('button', { class: 'btn btn--ghost btn--sm', type: 'button', text: '+ Add ' + field.item_label.toLowerCase(),
        onclick: function () { var blank = {}; field.fields.forEach(function (f) { blank[f.key] = f.type === 'checkbox' ? false : ''; }); items.push(blank); markDirty(); draw(); } }));
    }
    draw();
    return box;
  }

  function renderSection() {
    var sec = state.schema.sections.filter(function (s) { return s.id === state.section; })[0];
    var root = $('section'); root.innerHTML = '';
    root.appendChild(el('h2', { text: sec.title }));
    if (sec.intro) root.appendChild(el('p', { class: 'intro', text: sec.intro }));
    if (sec.dynamic === 'pages') {
      var pages = state.content.pages || {};
      var slugs = Object.keys(pages).sort();
      if (!state.page || !pages[state.page]) state.page = slugs[0];
      var sel = el('select', { class: 'in' });
      slugs.forEach(function (s) { var o = el('option', { value: s, text: (pages[s].h1 || s).replace(/<[^>]+>/g, '') + '  (/' + (s === 'services' ? 'services' : s) + '/)' }); if (s === state.page) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', function () { state.page = sel.value; renderSection(); });
      root.appendChild(el('div', { class: 'pages-pick' }, [el('label', { text: 'Page' }), sel]));
      sec.item_fields.forEach(function (f) { root.appendChild(inputFor(f, 'pages.' + state.page + '.' + f.key, pages[state.page][f.key])); });
      return;
    }
    sec.fields.forEach(function (f) {
      if (f.type === 'list') root.appendChild(listFor(f, f.key));
      else root.appendChild(inputFor(f, f.key, get(state.content, f.key)));
    });
  }

  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------------------------------------------------------------- save / discard
  $('save').addEventListener('click', function () {
    $('save').disabled = true; setStatus('', 'Saving…');
    api('content', 'PUT', { content: state.content }).then(function (j) {
      if (!j.ok) {
        setStatus('err', j.error || 'Save failed.');
        if (j.errors) { msg($('notice'), 'err', 'Please fix these before saving:', j.errors); window.scrollTo(0, 0); }
        $('save').disabled = false; return;
      }
      $('notice').innerHTML = '';
      state.saved = JSON.parse(JSON.stringify(state.content));
      setStatus('ok', j.note || 'Saved.');
    });
  });
  $('discard').addEventListener('click', function () {
    if (!confirm('Throw away your unsaved changes?')) return;
    state.content = JSON.parse(JSON.stringify(state.saved)); renderSection(); setStatus('', 'Changes discarded.');
  });

  // ---------------------------------------------------------------- password
  $('pw-open').addEventListener('click', function () { $('pw-modal').classList.remove('hidden'); msg($('pw-msg')); $('pw-form').reset(); $('pw-cur').focus(); });
  $('pw-cancel').addEventListener('click', function () { $('pw-modal').classList.add('hidden'); });
  $('pw-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('pw-new').value !== $('pw-new2').value) { msg($('pw-msg'), 'err', 'The new passwords do not match.'); return; }
    $('pw-save').disabled = true;
    api('password', 'POST', { current: $('pw-cur').value, next: $('pw-new').value }).then(function (j) {
      $('pw-save').disabled = false;
      if (!j.ok) { msg($('pw-msg'), 'err', j.error || 'Could not change the password.'); return; }
      msg($('pw-msg'), 'ok', j.note || 'Password changed.');
      setTimeout(function () { $('pw-modal').classList.add('hidden'); boot(); }, 1200);
    });
  });

  boot();
}());
</script>
</body>
</html>
